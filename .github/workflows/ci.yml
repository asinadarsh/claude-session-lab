name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # The gateway spawns the Claude CLI, kills process trees, and writes mode-restricted files,
    # all of which behave differently per OS. Running the suite on all three is the only honest
    # way to claim cross-platform support.
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Report environment
        run: node -e "console.log(process.platform, process.arch, process.version)"

      - name: Run tests
        run: npm test

      - name: Check syntax
        run: npm run check

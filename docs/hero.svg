<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Claude Session Lab</title>
  <desc id="desc">A dark technical interface showing a localhost-only OAuth handshake and isolated inference sandbox.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06070b"/>
      <stop offset="0.58" stop-color="#0d1019"/>
      <stop offset="1" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <radialGradient id="glowA">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".34"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB">
      <stop offset="0" stop-color="#ec4899" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#d5d6ff" stroke-opacity=".045"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="38"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <circle cx="165" cy="88" r="250" fill="url(#glowA)" filter="url(#blur)"/>
  <circle cx="1110" cy="520" r="250" fill="url(#glowB)" filter="url(#blur)"/>

  <g transform="translate(74 66)">
    <rect width="48" height="48" rx="14" fill="#7c3aed" fill-opacity=".12" stroke="#bfaeff" stroke-opacity=".75"/>
    <path d="M15 27c0-7 3.8-12.5 9.5-12.5 5.2 0 9.5 4.3 9.5 9.5s-4.3 9.5-9.5 9.5c-3.8 0-6.7-2.4-6.7-5.7 0-3 2.4-5.1 5.4-5.1 2.4 0 4 1.6 4 3.8" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round"/>
    <text x="66" y="21" fill="#f7f7fb" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="650">Claude Session Lab</text>
    <text x="66" y="43" fill="#9297ad" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" letter-spacing="1.7">LOCALHOST SECURITY RESEARCH</text>
  </g>

  <g transform="translate(74 164)">
    <text fill="#f7f7fb" font-family="Inter,Segoe UI,sans-serif" font-size="56" font-weight="650" letter-spacing="-2.8">
      <tspan x="0" y="0">Private OAuth.</tspan>
      <tspan x="0" y="62" fill="#b7a1ff">Ephemeral inference.</tspan>
    </text>
    <text x="2" y="108" fill="#b8bbcd" font-family="Inter,Segoe UI,sans-serif" font-size="17">Test subscription isolation without crossing your existing Claude Code profile.</text>
  </g>

  <g transform="translate(74 370)" filter="url(#shadow)">
    <rect width="1052" height="174" rx="22" fill="#11151f" fill-opacity=".91" stroke="#d5d6ff" stroke-opacity=".13"/>
    <path d="M1 1h1050" stroke="url(#accent)" stroke-opacity=".72"/>

    <g transform="translate(24 24)">
      <text fill="#9e8de7" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" letter-spacing="1.2">01 / SECURE HANDSHAKE</text>
      <g transform="translate(0 28)">
        <rect width="610" height="96" rx="14" fill="#080a10" fill-opacity=".65" stroke="#d5d6ff" stroke-opacity=".10"/>
        <g transform="translate(16 16)">
          <g>
            <circle cx="14" cy="14" r="14" fill="#7c3aed" fill-opacity=".18" stroke="#a78bfa"/>
            <path d="m8 14 4 4 8-9" fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round"/>
            <text x="38" y="11" fill="#f7f7fb" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="650">PREPARE</text>
            <text x="38" y="27" fill="#777d93" font-family="Inter,Segoe UI,sans-serif" font-size="9">PKCE S256</text>
          </g>
          <path d="M132 14h54" stroke="#5ee7b7" stroke-opacity=".35" stroke-dasharray="3 4"/>
          <g transform="translate(198)">
            <circle cx="14" cy="14" r="14" fill="#6366f1" fill-opacity=".18" stroke="#818cf8"/>
            <text x="38" y="11" fill="#f7f7fb" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="650">AUTHORIZE</text>
            <text x="38" y="27" fill="#777d93" font-family="Inter,Segoe UI,sans-serif" font-size="9">TEST ACCOUNT</text>
          </g>
          <path d="M354 14h54" stroke="#818cf8" stroke-opacity=".35" stroke-dasharray="3 4"/>
          <g transform="translate(420)">
            <circle cx="14" cy="14" r="14" fill="#5ee7b7" fill-opacity=".13" stroke="#5ee7b7"/>
            <path d="m8 14 4 4 8-9" fill="none" stroke="#5ee7b7" stroke-width="1.8" stroke-linecap="round"/>
            <text x="38" y="11" fill="#dffbef" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="650">CONNECTED</text>
            <text x="38" y="27" fill="#789b8f" font-family="Inter,Segoe UI,sans-serif" font-size="9">MEMORY ONLY</text>
          </g>
        </g>
      </g>
    </g>

    <g transform="translate(662 24)">
      <text fill="#9e8de7" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9" letter-spacing="1.2">02 / ISOLATED INFERENCE</text>
      <rect y="28" width="366" height="96" rx="14" fill="#080a10" fill-opacity=".65" stroke="#d5d6ff" stroke-opacity=".10"/>
      <g transform="translate(16 46)">
        <rect width="334" height="34" rx="8" fill="#141827" stroke="#d5d6ff" stroke-opacity=".12"/>
        <circle cx="17" cy="17" r="4" fill="#5ee7b7"/>
        <text x="30" y="21" fill="#c8cada" font-family="ui-monospace,SFMono-Regular,monospace" font-size="9">tmpfs / tools off / bounded process</text>
        <rect y="46" width="144" height="24" rx="7" fill="url(#accent)"/>
        <text x="14" y="62" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="9" font-weight="700">RUN INFERENCE</text>
        <text x="220" y="62" fill="#70758b" font-family="ui-monospace,SFMono-Regular,monospace" font-size="8">0 RUNTIME DEPS</text>
      </g>
    </g>
  </g>

  <g transform="translate(74 584)">
    <circle cx="5" cy="5" r="5" fill="#5ee7b7"/>
    <text x="18" y="9" fill="#9297ad" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" letter-spacing="1">LOOPBACK ONLY</text>
    <text x="188" y="9" fill="#9297ad" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" letter-spacing="1">HTTPONLY + CSRF</text>
    <text x="370" y="9" fill="#9297ad" font-family="ui-monospace,SFMono-Regular,monospace" font-size="10" letter-spacing="1">MIT LICENSE</text>
  </g>
</svg>
